<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
  </defs>
  
  <!-- Transparent canvas with rounded squircle badge (Ideal for F-Droid web and client) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" filter="url(#card-shadow)"/>
  
  <!-- App Symbol -->
  
        <!-- Notebook Base with Rounded Edges -->
        <rect x="156" y="130" width="170" height="252" rx="28" fill="#FFFFFF" filter="url(#drop-shadow)"/>
        
        <!-- Binding Spine / Margin Accent -->
        <path d="M 156 158 A 28 28 0 0 1 184 130 L 196 130 L 196 382 L 184 382 A 28 28 0 0 1 156 354 Z" fill="#fed7aa"/>
        
        <!-- Notebook Lines -->
        <rect x="216" y="180" width="80" height="12" rx="6" fill="#f97316" opacity="0.85"/>
        <rect x="216" y="216" width="70" height="10" rx="5" fill="#fdba74"/>
        <rect x="216" y="246" width="75" height="10" rx="5" fill="#fdba74"/>
        <rect x="216" y="276" width="55" height="10" rx="5" fill="#fdba74"/>
        <rect x="216" y="306" width="65" height="10" rx="5" fill="#fdba74"/>
        
        <!-- Stylus / Pencil Floating at Angle -->
        <g transform="translate(320, 290) rotate(45)">
          <rect x="-14" y="-70" width="28" height="85" rx="7" fill="#fbbf24" stroke="#c2410c" stroke-width="4"/>
          <!-- Pencil Cap / Eraser -->
          <rect x="-14" y="-95" width="28" height="25" rx="6" fill="#f43f5e" stroke="#c2410c" stroke-width="4"/>
          <!-- Pencil Tip -->
          <polygon points="-14,15 14,15 0,42" fill="#ffedd5" stroke="#c2410c" stroke-width="4" stroke-linejoin="round"/>
          <polygon points="-5,28 5,28 0,42" fill="#1e293b"/>
        </g>
        
</svg>